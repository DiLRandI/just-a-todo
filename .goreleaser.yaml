version: 2

project_name: todo

builds:
  - id: todo
    main: ./cmd/todo
    binary: todo
    ldflags:
      - -s -w
      - -X github.com/DiLRandI/just-a-todo/internal/cli.version={{.Version}}
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
